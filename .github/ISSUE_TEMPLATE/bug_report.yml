name: Bug report
description: Report a reproducible problem with the repository or its documented workflows.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Privacy reminder:** Do not include passwords, access tokens, API keys, recovery codes, private keys, or other sensitive or personal information. Remove or redact them from logs, screenshots, and links before submitting.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the problem clearly and where you encountered it.
      placeholder: What is not working as expected?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reliably reproduces the problem.
      placeholder: |
        1. Open ...
        2. Follow ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the intended result.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Include any relevant error message after removing sensitive values.
      placeholder: Describe the observed result.
    validations:
      required: true

  - type: textarea
    id: supporting_information
    attributes:
      label: Supporting information
      description: Optional context that helps investigate the report, such as relevant links, redacted screenshots, or the affected page or workflow. Do not share private or identifying information.
      placeholder: Add relevant, non-sensitive details or write "Not applicable".
    validations:
      required: false
